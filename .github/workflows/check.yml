name: check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm run tsc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm run lint

  # A required check. Only the unit tests: the e2e tests need a NOVA
  # instance and run in the workflow e2e (nova-instance.yml).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm run test:unit:run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm run build

  consumer-imports:
    name: Consumer import tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm run test:consumer

  # Whether a change of the API makes the right version: api-guard.yml
  api-surface:
    name: Check API surface is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Build library
        run: pnpm run build
      - name: Verify API reports are up to date
        # Changes to the API reports under etc/api-extractor/*.api.md must be
        # committed alongside the PR (run `pnpm api:update`).
        run: pnpm run api:check
